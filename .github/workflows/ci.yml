name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Güvenlik ve yetki testleri: veritabanı gerektirmez.
  unit-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bağımlılıklarını kur
        run: pip install -r requirements-test.txt
      - name: Güvenlik ve yetki testlerini çalıştır
        run: sh scripts/test.sh security
        env:
          SUPERBI_PYTHON: python

  # Entegrasyon (çekirdek): PostgreSQL ve MySQL. Her push ve PR'da çalışır.
  # Parolalar docker-compose.test.yml varsayılanlarıyla aynıdır (test içindir, gerçek sır değildir).
  integration-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATALENS_IT_POSTGRES_URL: postgresql+psycopg2://dl_test:dl_test_pw@127.0.0.1:15432/dl_test
      DATALENS_IT_MYSQL_URL: mysql+pymysql://dl_test:dl_test_pw@127.0.0.1:13306/dl_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL ve MySQL test servislerini başlat
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 300 postgres mysql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bağımlılıklarını kur
        run: pip install -r requirements-test.txt
      - name: Entegrasyon testlerini çalıştır
        run: sh scripts/test.sh integration
        env:
          SUPERBI_PYTHON: python
      - name: DB servislerini durdur
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Entegrasyon (ağır): MSSQL ve Oracle XE. Birkaç GB RAM ve uzun açılış süresi gerektirdiği için
  # yalnız elle (workflow_dispatch) tetiklenir.
  integration-heavy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATALENS_IT_MSSQL_URL: "mssql+pyodbc://sa:DlTest_Pw_2026!@127.0.0.1:11433/dl_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      DATALENS_IT_ORACLE_URL: oracle+oracledb://dl_test:dl_test_pw@127.0.0.1:11521/?service_name=XEPDB1
    steps:
      - uses: actions/checkout@v4
      - name: MSSQL ve Oracle test servislerini başlat
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 900 mssql oracle
      - name: MSSQL test veritabanını oluştur
        run: |
          docker exec superbi-it-mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
            -P 'DlTest_Pw_2026!' -C -Q "IF DB_ID('dl_test') IS NULL CREATE DATABASE dl_test"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sürücüleri kur (MSSQL için ODBC Driver 18 dahil)
        run: |
          pip install -r requirements-test.txt pyodbc
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: MSSQL ve Oracle entegrasyon testlerini çalıştır
        run: sh scripts/test.sh integration
        env:
          SUPERBI_PYTHON: python
      - name: DB servislerini durdur
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
